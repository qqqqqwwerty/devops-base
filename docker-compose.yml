services:
  backend:
    build: .
    volumes:
      - app_logs:/var/log/app
    environment:
      - APP_PORT=${APP_PORT}
      - LOG_PATH=${LOG_PATH}
      - APP_ENV=${APP_ENV}
      - SECRET_KEY=${SECRET_KEY}
    networks:
      - frontend_net
      - backend_net
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - frontend_net
    depends_on:
      - backend

  database:
    image: postgres:14-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - backend_net
    volumes:
      - db_data:/var/lib/postgresql/data


volumes:
  app_logs:
  db_data:


networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
