services:
  backend:
    build: .
    volumes:
      - app_logs:/var/log/app
    environment:
      - APP_PORT=${APP_PORT}
      - LOG_PATH=${LOG_PATH}
      - APP_ENV=${APP_ENV}
      - SECRET_KEY=${SECRET_KEY}
      - POSTGRES_HOST=database
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - frontend_net
      - backend_net
  web:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Use environment variable to switch between nginx configs
      # For local development with self-signed certificates (default):
      # NGINX_CONFIG=nginx-local.conf
      # For production with Let's Encrypt certificates:
      # NGINX_CONFIG=nginx.conf
      - ./${NGINX_CONFIG:-nginx-local.conf}:/etc/nginx/nginx.conf
      - ./certs/conf:/etc/letsencrypt
      - ./certs/www:/var/www/certbot
    environment:
      - NGINX_CONFIG=${NGINX_CONFIG:-nginx-local.conf}
    networks:
      - frontend_net
    depends_on:
      - backend

  database:
    image: postgres:14-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - backend_net
    volumes:
      - db_data:/var/lib/postgresql/data

  certbot:
    image: certbot/certbot
    volumes:
      - ./certs/conf:/etc/letsencrypt
      - ./certs/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait; done'"
    networks:
      - frontend_net


volumes:
  app_logs:
  db_data:


networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
