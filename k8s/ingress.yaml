apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-base-ingress
  namespace: devops-base
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: devops-base.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx-service
            port:
              number: 80